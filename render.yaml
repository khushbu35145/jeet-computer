services:
  - type: web
    name: jeet-web-solutions
    env: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: BRAND_NAME
        value: JEET Computer Education
      - key: CONTACT_PHONE
        value: "7413919688"
      - key: CONTACT_PHONE_ALT
        value: "8233316498"
      - key: WHATSAPP_NUMBER
        value: "917413919688"
      - key: CONTACT_EMAIL
        value: info@jeeteducation.com
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
